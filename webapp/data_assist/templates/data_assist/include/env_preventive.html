{% extends 'data_assist/fieldset.html' %}
{% load static %}

{% block fieldset_title %}
預防性治療
{% endblock %}

{% block fieldset_content %}
<div class="row py-3 justify-content-center">
    <div class="col-lg-5 py-2">
        <div class="form-check">
            <input class="form-check-input" type="radio" name="method" id="mother-son" value="mother_son" checked>
            <label class="form-check-label" for="mother-son">
                補母瀉子法
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="method" id="elements" value="elem">
            <label class="form-check-label" for="elements">
                五行補瀉法
            </label>
        </div>
    </div>
    <div class="row py-2">
        <div class="form-check col-sm-4 py-sm-2">
            <div class="row py-sm-2">
              <input class="form-check-input" type="checkbox" name="prevent" value="濕" id="t0_prevent">
              <label class="form-check-label" for="t0_prevent">
                防濕
              </label>
            </div>
            <div class="row py-sm-2">
                <input class="form-check-input" type="checkbox" name="prevent" value="燥" id="1M_prevent">
                <label class="form-check-label" for="1M_prevent">
                防燥
                </label>
            </div>
        </div>
        <div class="form-check col-sm-4 py-sm-2">
            <div class="row py-sm-2">
              <input class="form-check-input" type="checkbox" name="prevent" value="熱" id="s0_prevent">
              <label class="form-check-label" for="s0_prevent">
                防熱
              </label>
            </div>
            <div class="row py-sm-2">
                <input class="form-check-input" type="checkbox" name="prevent" value="寒" id="T1_prevent">
                <label class="form-check-label" for="T1_prevent">
                防寒
                </label>
            </div>
        </div>
        <div class="form-check col-sm-4 py-sm-2">
            <div class="row py-sm-2">
              <input class="form-check-input" type="checkbox" name="prevent" value="風" id="j0_prevent">
              <label class="form-check-label" for="j0_prevent">
                防風
              </label>
            </div>
            <div class="row py-sm-2">
                <input class="form-check-input" type="checkbox" name="prevent" value="暑" id="S1_prevent">
                <label class="form-check-label" for="S1_prevent">
                防暑
                </label>
            </div>
        </div>
    </div>
</div>
{% endblock %}
