{% extends 'data_assist/fieldset.html' %}
{% load static %}

{% block fieldset_title %}
根結穴
{% endblock %}

{% block fieldset_subtitle %}
把能量導引到手部經脈
{% endblock %}

{% block fieldset_content %}
<div class="row justify-content-center py-2">
            <div class="form-check col-sm-4 py-sm-2">
                <div class="row py-sm-2">
                  <input class="form-check-input" type="checkbox" name="knot" value="ty" id="kn_t0">
                  <label class="form-check-label" for="kn_t0">
                      太陰
                  </label>
                </div>
                <div class="row py-sm-2">
                    <input class="form-check-input" type="checkbox" name="knot" value="YM" id="kn_1M">
                    <label class="form-check-label" for="kn_1M">
                        陽明
                    </label>
                </div>
            </div>
            <div class="form-check col-sm-4 py-sm-2">
                <div class="row py-sm-2">
                  <input class="form-check-input" type="checkbox" name="knot" value="sy" id="kn_s0">
                  <label class="form-check-label" for="kn_s0">
                      少陰
                  </label>
                </div>
                <div class="row py-sm-2">
                    <input class="form-check-input" type="checkbox" name="knot" value="TY" id="kn_T1">
                    <label class="form-check-label" for="kn_T1">
                        太陽
                    </label>
                </div>
            </div>
            <div class="form-check col-sm-4 py-sm-2">
                <div class="row py-sm-2">
                  <input class="form-check-input" type="checkbox" name="knot" value="jy" id="kn_j0">
                  <label class="form-check-label" for="kn_j0">
                      厥陰
                  </label>
                </div>
                <div class="row py-sm-2">
                    <input class="form-check-input" type="checkbox" name="knot" value="SY" id="kn_S1">
                    <label class="form-check-label" for="kn_S1">
                        少陽
                    </label>
                </div>
            </div>
        </div>
{% endblock %}

<fieldset class="border p-5 m-3">
    <div class="form-group row py-3 justify-content-center">
        <legend class="form-label py-4"><h1></h1>
        </legend>

    </div>
</fieldset>
