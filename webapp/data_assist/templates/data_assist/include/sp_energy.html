{% extends 'data_assist/fieldset.html' %}
{% load static %}

{% block fieldset_title %}
臟腑能量
{% endblock %}

{% block fieldset_content %}

{% if lord != "SP" %}

<h2 class="text-primary py-3">調脾土</h2>

<div class="container row py-3 justify-content-center">
    <div class="row justify-content-center py-3">
        <h2 class="text-secondary py-1">君</h2>
        {{ lord }}
    </div>
    <h4 class="text-info py-1">以下相生</h4>
    <div class="row justify-content-center py-3">
        <h2 class="text-secondary py-1">母</h2>
        {{ E_mother }}
    </div>
    <div class="row justify-content-center py-3">
        <h2 class="text-secondary py-1">子</h2>
        {{ E_son }}
    </div>
    <h4 class="text-info py-1">以下相剋</h4>
    <div class="row justify-content-center py-3">
        <h2 class="text-secondary py-1">臣</h2>
        {{ E_minister }}
    </div>
    <div class="row justify-content-center py-3">
        <h2 class="text-secondary py-1">所剋之敵</h2>
        {{ E_inhibited }}
    </div>
</div>

{% endif %}

{% endblock %}
