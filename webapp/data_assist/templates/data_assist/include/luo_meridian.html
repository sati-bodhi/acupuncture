{% extends 'data_assist/fieldset.html' %}
{% load static %}

{% block fieldset_title %}
能量狀態
{% endblock %}

{% block fieldset_content %}

<h2 class="text-secondary pt-2">經絡</h2>

<div class="col-lg-5 py-3">

    <div class="form-group row justify-content-center py-2">
        <select name="meridian" class="form-select py-1" style="font-size:20px;" id="meridian">

            {% if meridian %}
            <option value="{{ meridian }}" selected>{{ meridian_name }}（{{ meridian }}）</option>
            {% else %}
            <option value=""></option>
            {% endif %}

            {% for id, meridian in meridian_list %}
            <option value="{{ id }}">
                {{ meridian }}（{{ id }}）</option>
            {% endfor %}

        </select>
    </div>

</div>

<h2 class="text-secondary py-2">狀態</h2>

<div class="col-lg-5 py-3">

    <div class="form-group row justify-content-center">

        <div class="form-check">
            <input class="form-check-input" type="radio" name="state" id="excess" value="+"
            {% if meridian_state == "+" %}
            checked
            {% endif %}
            >
            <label class="form-check-label" for="excess">
            有餘
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="state" id="deficient" value="-" \
            {% if meridian_state == "-" %}
            checked
            {% endif %}
            >
            <label class="form-check-label" for="deficient">
            不足
            </label>
        </div>

    </div>

</div>

{% endblock %}

<!-- What lies outside the block will not be rendered. -->

<!-- radio button -->

        <div class="form-check">
            <input class="form-check-input" type="radio" name="" id="" value="">
            <label class="form-check-label" for="">

            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="" id="" value="">
            <label class="form-check-label" for="">

            </label>
        </div>

<!-- back button -->

<div class="col py-3">
    <button class="btn btn-primary" type="button" onclick="history.back()">Back</button>
</div>

<!-- Dropdown list -->

<select name="" class="form-select py-1" style="font-size:20px;" id="">

    {% for id, zh_name in meridian_list %}
    <option value="{{ organ_id }}">
        {{ zh_name }}（{{ id }}）</option>
    {% endfor %}

</select>
