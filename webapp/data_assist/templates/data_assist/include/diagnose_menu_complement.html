{% extends 'data_assist/fieldset.html' %}
{% load static %}

{% block fieldset_title %}
輔助能量系統
{% endblock %}

{% block fieldset_content %}

<header class="py-2">
    <h2 class="text-info">十二經筋</h2>
    <small><em>十二正經在體表的<br class="d-md-none">筋膜系統</em></small>
</header>
<div class="col-lg-10 py-2">
    <div class="row py-3">
        <h3 class="py-2 text-secondary">季節性痹症</h3>
        <span class="h3"><a href="{% url 'jingjin' %}" class="href">經筋</a>療法</span>
    </div>
</div>

<hr>

<header class="py-2">
    <h2 class="text-info">十二經別</h2>
    <small><em>臟腑與十二正經<br class="d-md-none">的聯繫</em></small>
</header>
<div class="col-lg-10 py-2">
    <div class="row py-3">
        <h3 class="py-2 text-secondary">一天特定時段發病</h3>
        <span class="h3"><a href="{% url 'jingbie' %}" class="href">經別</a>療法</span>
    </div>
</div>

<hr>

<h2 class="text-info py-2">十六絡脈</h2>
<div class="col-lg-10 py-2">
    <div class="row py-3">
        <h3 class="py-2 text-secondary">無脈象的特殊症狀</h3>
        <p class="h3"><a href="{% url 'luo' %}" class="href">縱絡與橫絡</a></p>
    </div>
    <div class="row py-3">
        <h3 class="py-2 text-secondary">疼痛或半身不遂</h3>
        <span class="h3"><a href="{% url 'group_luo' %}" class="href">組絡</a>療法</span>
    </div>
</div>
{% endblock %}

<!-- What lies outside the block will not be rendered. -->

<!-- radio button -->

        <div class="form-check">
            <input class="form-check-input" type="radio" name="" id="" value="">
            <label class="form-check-label" for="">

            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="" id="" value="">
            <label class="form-check-label" for="">

            </label>
        </div>

<!-- back button -->

<div class="col py-3">
    <button class="btn btn-primary" type="button" onclick="history.back()">Back</button>
</div>

<!-- Dropdown list -->

<select name="" class="form-select py-1" style="font-size:20px;" id="">

    {% for id, zh_name in meridian_list %}
    <option value="{{ organ_id }}">
        {{ zh_name }}（{{ id }}）</option>
    {% endfor %}

</select>
